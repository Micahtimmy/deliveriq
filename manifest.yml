modules:
  jira:globalPage:
    - key: ici-dashboard-page
      title: DeliverIQ — Delivery & Contributor Intelligence
      layout: basic
      resource: ici-app
      resolver:
        function: resolver

  function:
    - key: resolver
      handler: resolvers/index.handler

resources:
  - key: ici-app
    path: static/ici-app/build
    tunnel:
      port: 3000

permissions:
  scopes:
    - read:jira-work
    - read:jira-user
    - read:board-scope:jira-software
    - read:sprint:jira-software
    - read:project:jira
    - read:issue-details:jira
    - read:jql:jira
    - storage:app
app:
  id: ari:cloud:ecosystem::app/c2c643ae-39aa-4ead-a611-a3fee1a011f5
  runtime:
    name: nodejs22.x
